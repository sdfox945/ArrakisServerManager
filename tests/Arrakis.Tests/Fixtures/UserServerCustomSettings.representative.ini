[/Script/DuneSandbox.UserServerCustomSettings]
DifficultyLevel=Custom
;------------------------------------------------------------------------------
; HARVESTING
;------------------------------------------------------------------------------

; /!\ This setting is already exposed in UserEngine.ini as
; Dune.GlobalMiningOutputMultiplier and Dune.GlobalVehicleMiningOutputMultiplier.
; Higher = more resources per harvest.
; Possible values: 0.1 to 10
GatheringAmount=5.000000

; Possible values: 0 to 10 (0 removes crafting costs)
CraftingCost=0.750000

; Higher = extraction takes longer.
; Possible values: 0.1 to 10
WaterExtractionRate=5.000000

; Possible values: 0 to 5 (0 means instant crafting/refining)
CraftingTimeMultiplier=0.250000

; Higher = loot chests take longer to spawn back.
; Possible values: 0.1 to 10
LootRespawnSpeed=0.100000

; Possible values: 0 to 10 (0 removes building costs)
BuildingCostMultiplier=0.750000

; Higher = resources respawn sooner.
; Possible values: 0.1 to 10
ResourceRespawnSpeed=2.000000

; Possible values: 0 to 10 (0 removes fuel burn)
FuelBurnTimeMultiplier=10.000000

; Higher = carry more items.
; Possible values: 0.1 to 10
InventoryVolumeMultiplier=10.000000

;------------------------------------------------------------------------------
; COMBAT
;------------------------------------------------------------------------------

; Possible values: 0.1 to 10
PlayerDamageToPlayer=1.000000

; Possible values: 0.1 to 10
PlayerDamageToNPC=1.000000

; Possible values: 0.1 to 10
PlayerDamageToVehicle=1.000000

; Possible values: 0.1 to 10
NPCHealth=1.000000

; Possible values: 0.1 to 10
NPCDamageToPlayer=1.000000

; Possible values: 0.1 to 10
NPCDamageToNPC=1.000000

; Higher = respawn sooner.
; Possible values: 0.1 to 10
NPCRespawnMultiplier=1.000000

; How much damage players deal to unshielded bases.
; Possible values: 0 to 10 (0 means structures take no PvP damage)
PVPDamageStructures=1.000000

; Possible values: 0 to 10 (0 means no XP is gained)
GlobalXpMultiplier=2.000000

; Possible values: 0 to 10 (0 means no XP from combat)
CombatXp=2.000000

; Possible values: 0 to 10 (0 means no XP from gathering)
GatheringXp=2.000000

; Possible values: 0 to 10 (0 means no XP from missions)
MissionXp=2.000000

; Possible values: 0 to 10 (0 disables durability loss, items never wear out)
ItemDurabilityDrainMultiplier=0.250000

; Possible values: True, False
bEnableItemMaxDurabilityLoss=False

; Higher = stamina drains faster, lower = stamina lasts longer.
; Possible values: 0.1 to 10
PlayerStaminaDrain=0.500000

; Possible values: 0 to 10 (0 means no Intel Points are gained)
IntelPointsGainMultiplier=2.000000

; Higher = player shields last longer.
; Possible values: 0.1 to 10
PlayerShieldDamageAbsorptionMultiplier=1.000000

; Higher = NPC shields last longer.
; Possible values: 0.1 to 10
NPCShieldDamageAbsorptionMultiplier=1.000000


;------------------------------------------------------------------------------
; SURVIVAL
;------------------------------------------------------------------------------

; Possible values: 0 to 10 (0 disables heat buildup)
HeatBuildupRate=0.500000

; Possible values: 0 to 10 (0 disables thirst)
ThirstMultiplier=0.500000

; Possible values: All, Backpack, Default, None
DropEquipmentOnDeath=Default

; Whether buildings can be damaged by environmental sources (sandstorms, decay, etc).
; Possible values: True, False
bAllowDynamicBuildingDamage=True

; /!\ This setting is already exposed in UserEngine.ini as
; Sandstorm.Enabled and m_bCoriolisAutoSpawnEnabled.
; Possible values: True, False
;bAllowSandstorms=True

; /!\ This setting is already exposed in UserEngine.ini as sandworm.dune.Enabled.
; Possible values: True, False
;bAllowSandworms=True

; Possible values: All, Backpack, Default, None
SandwormConsequences=All

; Possible values: DependsOnSecurityZone, NeverAllowOtherPlayers, AlwaysAllowOtherPlayers
PlayerDeathLootRule=DependsOnSecurityZone


;------------------------------------------------------------------------------
; PERSISTENCE / LANDSRAAD
;------------------------------------------------------------------------------

; Whether the game's no-build zones are enforced. 
;   True  = players cannot build in no-build zones (normal rules)
;   False = players may build in what are normally no-build zones
; Possible values: True, False
bIsBuildingRestrictionsEnabled=True

; Possible values: 0 to 10 (0 means no Landsraad contribution is generated)
LandsraadContributionMultiplier=5.000000

; Possible values: 0 to 10 (0 means no specialization XP from Landsraad)
LandsraadSpecializationXpMultiplier=5.000000

; Possible values: 0 to 10 (0 means faction standing never changes)
LandsraadFactionStandingMultiplier=5.000000

;------------------------------------------------------------------------------
; BUILDING
;------------------------------------------------------------------------------

; Number of bases you can own
; Possible values: 0 to 10 (integers)
;FiefdomLimit=3

; Possible values: 0.1 to 10
BuildingPieceLimitMultiplier=5.000000

; Possible values: True, False
bBuildingInfiniteStability=False

; How long the sub-fief console can still be backed up after the base was
; built or last backed up.
; Possible values: number of hours
BaseBackupToolTimeRestriction=0.000001